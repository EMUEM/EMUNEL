# EMUNEL — production compose stack.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# One unified service (API + InstanceManager + Core subprocesses) with a
# persistent volume. PostgreSQL is optional; without it the platform runs
# on embedded SQLite in the same volume.

services:
  emunel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: emunel/emunel:latest
    container_name: emunel
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      EMUNEL_DATA_ROOT: /data
      # Instance Core ports are loopback-only inside the container network;
      # the reverse proxy (below) is the single public entry point.
      EMUNEL_PORT_RANGE_START: "18100"
      EMUNEL_PORT_RANGE_END: "18999"
    volumes:
      - emunel-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
    # Instance Core subprocesses inherit a hard memory/CPU budget from the
    # container; the manager applies per-instance rlimits on top.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # ---- Optional PostgreSQL (uncomment and set EMUNEL_DATABASE_URL) -------
