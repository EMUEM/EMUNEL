# EMUNEL — production compose stack.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# One unified service (API + InstanceManager + Core subprocesses) with a
# persistent volume. PostgreSQL is optional; without it the platform runs
# on embedded SQLite in the same volume. Secrets: with the EMUNEL_* secret
# variables unset, strong ones are generated on first boot and persisted
# under /data (the initial admin password is printed once in the logs).

services:
  emunel:
    build:
      context: ..
      dockerfile: Dockerfile
    image: emunel/emunel:latest
    container_name: emunel
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      EMUNEL_DATA_ROOT: /data
      # Loopback Cores + one public entry point. Set EMUNEL_CORE_BIND_HOST
      # to 0.0.0.0 here if you expose instance ports through an edge proxy.
      EMUNEL_PORT: "8080"
      EMUNEL_PORT_RANGE_START: "18100"
      EMUNEL_PORT_RANGE_END: "18999"
    volumes:
      - emunel-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen('http://127.0.0.1:' + (os.getenv('EMUNEL_PORT') or os.getenv('PORT') or '8000') + '/health', timeout=3)"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s
    # Instance Core subprocesses inherit a hard memory/CPU budget from the
    # container; the manager applies per-instance rlimits on top.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  # ---- Optional PostgreSQL (uncomment and set EMUNEL_DATABASE_URL) -------
