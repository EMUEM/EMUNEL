# EMUNEL — single-service self-hosting stack.
# Builds the repo-root Dockerfile: Console (public endpoint) + embedded
# Worker + isolated Core instances, all in one container.
services:
  emunel:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # zero-config defaults handle everything; override only what you need:
      # EMUNEL_PUBLIC_URL: https://your.domain
      # DATABASE_URL: postgresql://user:pass@db:5432/emunel
      # EMUNEL_GITHUB_CLIENT_ID / EMUNEL_GITHUB_CLIENT_SECRET: OAuth login
      PORT: "8080"
    volumes:
      - emunel-data:/data
    restart: unless-stopped

  # Optional PostgreSQL (auto-detected via DATABASE_URL when enabled)
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: emunel
  #     POSTGRES_PASSWORD: emunel
  #     POSTGRES_DB: emunel
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data

volumes:
  emunel-data:
