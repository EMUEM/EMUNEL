<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c11" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="EMUNEL — multi-protocol proxy management console" />
  <title>EMUNEL</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Cpath d='M16 2.5 27.5 9v14L16 29.5 4.5 23V9L16 2.5z' stroke='%23dde5f2' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M11 11v10M21 11v10M11 16h10' stroke='%23dde5f2' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/assets/css/emunel.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Login screen (shown when unauthenticated) -->
    <div id="login-screen" class="login-screen hidden">
      <div class="login-glow"></div>
      <form class="login-card" id="login-form">
        <div class="login-logo" id="login-logo"></div>
        <h1>EMUNEL</h1>
        <p class="login-tag" data-i18n="login.tagline">Proxy management console</p>
        <label class="field">
          <span data-i18n="login.username">Username</span>
          <input type="text" id="login-username" autocomplete="username" required autofocus />
        </label>
        <label class="field">
          <span data-i18n="login.password">Password</span>
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <button class="btn primary full" type="submit" data-i18n="login.submit">Sign in</button>
        <p id="login-error" class="error-text hidden"></p>
        <p class="login-hint" data-i18n="login.hint">Default account: admin / admin — change it after first sign-in</p>
      </form>
    </div>

    <!-- Authenticated shell -->
    <div id="shell" class="shell hidden">
      <aside class="sidebar" id="sidebar">
        <div class="brand">
          <span class="brand-mark" id="brand-mark"></span>
          <div>
            <div class="brand-name">EMUNEL</div>
            <div class="brand-sub">Console</div>
          </div>
        </div>
        <nav id="nav" class="nav"></nav>
        <div class="sidebar-foot">
          <button class="btn ghost small" id="lang-toggle" title="فارسی / English"><span id="lang-ico"></span></button>
          <button class="btn ghost small" id="logout-btn"><span data-i18n="nav.logout">Sign out</span></button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar" id="topbar">
          <button class="menu-btn" id="menu-btn" aria-label="menu"></button>
          <h2 id="page-title" class="page-title">Dashboard</h2>
          <div class="topbar-right">
            <span id="health-dot" class="health-dot" title="health"></span>
            <span class="user-chip" id="user-chip"></span>
          </div>
        </header>
        <section id="view" class="view" aria-live="polite"></section>
      </main>

      <nav class="bottom-nav" id="bottom-nav"></nav>
    </div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" dir="ltr"></div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
